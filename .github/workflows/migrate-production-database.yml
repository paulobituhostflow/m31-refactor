name: Apply M31 production database migrations
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: m31-production-database-migrations
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify production database target
        run: |
          node --input-type=module <<'NODE'
          const expectedRef = "czpimidslxtzodlaiwtg";
          const databaseUrl = new URL(process.env.SUPABASE_URL ?? "");
          if (databaseUrl.hostname !== `${expectedRef}.supabase.co`) {
            throw new Error("SUPABASE_URL does not point to the production project.");
          }
          if (!process.env.SUPABASE_DB_PASSWORD) {
            throw new Error("SUPABASE_DB_PASSWORD is missing from the production environment.");
          }
          console.log("Production project verified; database password is present.");
          NODE
      - name: Preview pending migrations
        run: |
          set -euo pipefail
          DATABASE_URL="$(node --input-type=module -e '
            const ref = "czpimidslxtzodlaiwtg";
            const url = new URL(`postgresql://postgres.${ref}@aws-0-us-east-1.pooler.supabase.com:5432/postgres`);
            url.password = process.env.SUPABASE_DB_PASSWORD;
            process.stdout.write(url.toString());
          ')"
          echo "::add-mask::$DATABASE_URL"
          npx supabase db push --db-url "$DATABASE_URL" --dry-run --skip-vault
      - name: Apply pending migrations
        run: |
          set -euo pipefail
          DATABASE_URL="$(node --input-type=module -e '
            const ref = "czpimidslxtzodlaiwtg";
            const url = new URL(`postgresql://postgres.${ref}@aws-0-us-east-1.pooler.supabase.com:5432/postgres`);
            url.password = process.env.SUPABASE_DB_PASSWORD;
            process.stdout.write(url.toString());
          ')"
          echo "::add-mask::$DATABASE_URL"
          npx supabase db push --db-url "$DATABASE_URL" --skip-vault --yes
